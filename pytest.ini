[pytest]
testpaths = tests
pythonpath = .
markers =
    smoke: fast checks run on every commit
    regression: full pack, run nightly
    app: store business rules (BRD)
    ingestion: source -> raw -> silver loads
    transformation: business rules and derived fields
    storage: keys, SCD history, referential integrity, data quality
    consumption: gold, KPIs and report tie-out
    reconciliation: system A vs system B
    ai: Ops Assistant and AI-assisted testing
